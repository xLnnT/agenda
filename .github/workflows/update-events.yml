name: Afspraken bijwerken

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths: [calendars.json, scripts/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:events
        continue-on-error: true
        env:
          FEED_WERK: ${{ secrets.FEED_WERK }}
          FEED_GIGS: ${{ secrets.FEED_GIGS }}
          FEED_VRT: ${{ secrets.FEED_VRT }}
          FEED_PRIVE: ${{ secrets.FEED_PRIVE }}
      - name: Commit als er iets veranderd is
        run: |
          if git diff --quiet -- site/events.json; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/events.json
          git commit -m "Afspraken bijgewerkt"
          git push
